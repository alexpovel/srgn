[package]
name = "srgn"
version = "0.14.2"
edition = "2024"
authors = ["Alex Povel <rust@alexpovel.de>"]
description = "A grep-like tool which understands source code syntax and allows for manipulation in addition to search"
license = "MIT"
repository = "https://github.com/alexpovel/srgn"
readme = "README.md"
documentation = "https://docs.rs/srgn"
keywords = ["grep", "grammars", "languages", "search", "manipulation"]
categories = [
    "command-line-utilities",
    "development-tools",
    "localization",
    "text-editors",
    "text-processing",
]
rust-version = "1.99.0"
exclude = [
    # Contains large submodules; those should *not* be checked out when packaging for
    # crates.io, aka not end up being a problem, but protect against accidents
    "benches/",
    ".vscode/",
    ".github/",
    "release-please-config.json",
    "flake.nix",
    "flake.lock",
]

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
cached = { version = "4.0.0", optional = true, default-features = false, features = [
    "ahash",
    "proc_macro",
] }
clap = { version = "4.6.7", features = [
    "derive",
    "env",
    "error-context",
    "string",
    "wrap_help",
] }
clap_complete = "4.6.11"
colored = "3.1.1"
const_format = "0.2.36"
decompound = { version = "0.3.0", optional = true }
env_logger = { version = "0.11.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }
fancy-regex = "0.19.2"
fst = { version = "0.4.7", optional = true }
glob = "0.3.4"
grep-cli = "0.1.12"
ignore = "0.4.33"
itertools = "0.15.0"
log = "0.4.34"
pathdiff = "0.2.3"
regex = "1.13.1"
streaming-iterator = "0.1.9"
tempfile = "3.27.0"
titlecase = "3.6.0"
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-hcl = "1.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
unescape = "0.1.0"
unicode-normalization = "0.1.25"
unicode_categories = "0.1.1"
unicode_titlecase = "2.5.0"

[features]
all = ["german", "symbols"]
default = ["all"]
german = ["cached", "decompound", "fst"]
symbols = []

[dev-dependencies]
assert_cmd = "2.2.2"
comrak = { version = "0.55.0", default-features = false }
enum-iterator = "2.3.0"
insta = { version = "1.48.0", features = ["yaml"] }
nom = "8.0.0"
predicates = { version = "3.1.4", default-features = false }
pretty_assertions = "1.4.1"
proptest = "1.11.0"
rand = "0.10.3"
rand_regex = "0.19.0"
rstest = { version = "0.27.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"], default-features = false }

[lints.clippy]
# Clippy's default groups are already enabled, including correctness at `deny`.
# Lower group priorities let individual lints override them.
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Keep the existing opt-in to experimental lints; review new findings on upgrades.
nursery = { level = "warn", priority = -1 }

# Selected restriction lints; enabling the entire group is not recommended:
# https://doc.rust-lang.org/clippy/lints.html#restriction
dbg_macro = "warn"
mem_forget = "warn"
rc_mutex = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_rest_pattern = "warn"
unused_result_ok = "warn"

# Dependency trees can legitimately contain multiple versions of the same crate.
multiple_crate_versions = "allow"
# Descriptive type names need not depend on the module they live in.
module_name_repetitions = "allow"

[lints.rust]
# Opt-in lints available on the MSRV. Default warnings and migration lints for
# editions up to our current edition (2024) do not need to be repeated here.
# https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html
ambiguous_negative_literals = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
impl_trait_redundant_captures = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unsafe_code = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[profile.dev.package.insta]
# https://insta.rs/docs/quickstart/#optional-faster-runs
opt-level = 3

[profile.dev.package.similar]
# https://insta.rs/docs/quickstart/#optional-faster-runs
opt-level = 3

[build-dependencies]
decompound = "0.3.0"
fst = "0.4.7"
rayon = "1.12.0"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
